let sym='BYTE',news='',newsT=0;
function tick(o){o.m=o.m*.8+(Math.random()-.5)*o.v*.6;let g=o.v*(Math.random()*2-1)+o.m;
 if(Math.random()<.012){g+=(Math.random()<.5?-1:1)*(.08+Math.random()*.08);news=`${o.s} ${g>0?'jumps':'drops'} on breaking news`;newsT=7}
 o.p=Math.max(.5,o.p*(1+g)*(1+(o.o-o.p)/o.o*.004));o.h.push(o.p);if(o.h.length>90)o.h.shift()}
for(let i=0;i<60;i++)ST.forEach(tick);
function chart(c,a){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
 const mn=Math.min(...a),mx=Math.max(...a);x.strokeStyle=a[a.length-1]>=a[0]?'#35d49a':'#ff5d6c';x.lineWidth=2;x.lineJoin='round';x.beginPath();
 a.forEach((v,i)=>{const X=i/(a.length-1)*w,Y=h-6-(v-mn)/(mx-mn||1)*(h-12);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}
function live(){if(T!='trade')return;const o=ST.find(x=>x.s==sym),ps=S.pos[sym],pc=(o.p/o.h[0]-1)*100;
 $('#tn').textContent=sym;$('#tpv').innerHTML=`${usd(o.p)} <small class="${pc<0?'dn':'up'}">${pc>=0?'+':''}${pc.toFixed(1)}%</small>`;chart($('#tc'),o.h);
 $('#th').textContent=ps?`You hold ${ps.q} at an average of ${usd(ps.a)}. Profit or loss ${usd((o.p-ps.a)*ps.q)}`:'You do not hold this stock';
 $('#ml').innerHTML=ST.map(x=>{const c=(x.p/x.h[0]-1)*100;return `<div class="row2" data-s="${x.s}"><b>${x.s}</b><span>${usd(x.p)}</span><span class="${c<0?'dn':'up'}">${c>=0?'+':''}${c.toFixed(1)}%</span><span class="mu">${S.pos[x.s]?S.pos[x.s].q+' sh':''}</span></div>`}).join('');
 $('#nw').hidden=!news;$('#nw').textContent=news}
function rTrade(){
 $('#t-trade').innerHTML=`<div class="box" id="nw" hidden style="margin-bottom:10px"></div><div class="box"><div class="row" style="padding-top:0"><b id="tn" style="font-size:20px"></b><b id="tpv" style="font-size:20px"></b></div><canvas id="tc" style="height:150px"></canvas><p class="mu" id="th"></p><label>Shares</label><input id="qt" type="number" inputmode="numeric" min="1" step="1" value="1"><div class="two"><button class="pri" id="by" style="background:var(--ok)">Buy</button><button class="pri" id="se" style="background:var(--no);color:#fff">Sell</button></div><small class="mu">Each order has a 0.5% fee. Prices move fast, so watch the news.</small></div><h3>Market</h3><div class="box" id="ml"></div>`;
 $('#by').onclick=()=>{const q=Math.floor(+$('#qt').value),o=ST.find(x=>x.s==sym);if(!(q>0))return;const cost=r2(q*o.p*1.005);if(cost>S.c)return toast('Insufficient funds');
  add(-cost);const p=S.pos[sym]||(S.pos[sym]={q:0,a:0});p.a=(p.a*p.q+cost)/(p.q+q);p.q+=q;save();toast(`Bought ${q} ${sym}`);live()};
 $('#se').onclick=()=>{const q=Math.floor(+$('#qt').value),o=ST.find(x=>x.s==sym),p=S.pos[sym];if(!(q>0))return;if(!p||q>p.q)return toast('Not enough shares');
  add(r2(q*o.p*.995));p.q-=q;if(!p.q)delete S.pos[sym];save();toast(`Sold ${q} ${sym}`);live()};
 live()}
setInterval(()=>{ST.forEach(tick);if(newsT&&!--newsT)news='';live()},1500);
document.addEventListener('pointerdown',e=>{const x=e.target.closest('[data-s]');if(x){sym=x.dataset.s;live()}});

// ---------- Casino ----------
const betbar=`<div class="box"><label style="margin:0">Your bet</label><input id="bet" type="number" inputmode="decimal" min="0.01" step="0.01" value="1"><div class="two"><button data-b="h">Half</button><button data-b="m">All in</button></div></div>`;
function cas(t,h){openOv(t,betbar+h);$$('[data-b]').forEach(b=>b.onclick=()=>$('#bet').value=b.dataset.b=='m'?S.c:Math.max(.01,r2((+$('#bet').value||1)/2)))}
const take=()=>{const b=r2(+$('#bet').value);if(!(b>0)){toast('Enter a bet');return 0}return pay(b)?b:0};
const felt0=`<div class="felt"><p class="mu">Dealer</p><div class="hand"><span class="pc back"></span><span class="pc back"></span></div><p class="mu">Place your bet, then deal</p></div>`;
const deck=()=>{const d=[];for(const s of '♠♥♦♣')for(let r=1;r<=13;r++)d.push({r,s});for(let i=d.length;i>1;){const j=rn(i--);[d[i],d[j]]=[d[j],d[i]]}return d};
const cd=(c,h)=>{const r={1:'A',11:'J',12:'Q',13:'K'}[c.r]||c.r;return `<span class="pc ${h?'back':'♥♦'.includes(c.s)?'rd':''}">${h?'':`<i>${r}${c.s}</i><b>${c.s}</b>`}</span>`};
function bj(){
 cas('Blackjack',`<button class="pri" id="go">Deal</button><div id="tb">${felt0}</div>`);
 $('#go').onclick=()=>{const b=take();if(!b)return;$('#go').hidden=true;
  const d=deck(),P=[d.pop(),d.pop()],D=[d.pop(),d.pop()],val=h=>{let s=h.reduce((t,c)=>t+Math.min(c.r,10),0);return h.some(c=>c.r==1)&&s+10<=21?s+10:s};
  const show=(hide,msg)=>{$('#tb').innerHTML=`<div class="felt bjt"><span class="chip">${usd(b)}</span><p class="mu c">Dealer bot ${hide?'':val(D)}</p><div class="hand">${D.map((c,i)=>cd(c,hide&&i)).join('')}</div><p class="mu c">You ${val(P)}</p><div class="hand">${P.map(c=>cd(c)).join('')}</div>${msg?`<p class="big c">${msg}</p>`:'<div class="two"><button id="hit">Hit</button><button id="st">Stand</button></div>'}</div>`;
   if(!msg){$('#hit').onclick=()=>{P.push(d.pop());val(P)>21?fin():show(1)};$('#st').onclick=fin}};
  const fin=()=>{while(val(D)<17)D.push(d.pop());const pv=val(P),dv=val(D),pn=pv==21&&P.length==2,dn=dv==21&&D.length==2;
   const w=pv>21?0:pn&&!dn?2.5:dn&&!pn?0:dv>21||pv>dv?2:pv==dv?1:0;add(b*w);
   show(0,w>1?'You win '+usd(b*(w-1)):w==1?'Push, bet returned':'Dealer wins');$('#go').hidden=false;$('#go').textContent='Deal again'};
  show(1);if(val(P)==21)fin()}}
function wheel(){
 const C=['#e53935','#1e88e5','#43a047','#fdd835'],N=['Red','Blue','Green','Gold'],X=[2.2,2.8,5.5,11],q=[0,1,0,2,0,1,0,3,0,1,0,2,0,1,0,2,0,1,0,3,1,2,1,1];
 cas('Color Wheel',`<div class="felt"><div class="whw"><div class="ptr"></div><div id="wh" class="wh" style="background:conic-gradient(${q.map((c,i)=>`${C[c]} ${i*15}deg ${i*15+15}deg`).join(',')})"></div></div></div><div class="four">${N.map((n,i)=>`<button class="cc${i?'':' on'}" data-p="${i}" style="--c:${C[i]}">${n}<small>x${X[i]}</small></button>`).join('')}</div><button class="pri" id="go">Spin</button><p class="c" id="rs"></p>`);
 let p=0,rot=0,busy=0;
 $$('.cc').forEach(b=>b.onclick=()=>{p=+b.dataset.p;$$('.cc').forEach(y=>y.classList.toggle('on',y==b))});
 $('#go').onclick=()=>{if(busy)return;const b=take();if(!b)return;busy=1;$('#rs').textContent='';
  const bot=rn(4),idx=rn(24),tg=(360-(idx*15+7.5+(Math.random()-.5)*8)+360)%360;rot+=1800+(tg-rot%360+360)%360;$('#wh').style.transform=`rotate(${rot}deg)`;
  O(()=>{const col=q[idx],w=col==p;if(w)add(r2(b*X[p]));$('#rs').innerHTML=`Landed on <b>${N[col]}</b>. ${w?'You win '+usd(b*(X[p]-1)):'You lose '+usd(b)}.<br><span class="mu">Bot bet ${N[bot]} and ${bot==col?'won':'lost'}.</span>`;busy=0},4200)}}
function spit(){
 cas('Spit',`<p class="mu c">Play a card one higher or lower than a center card (Ace and King count as neighbors). Clear all your cards before the bot does. Win pays double.</p><button class="pri" id="go">Deal</button><div id="tb">${felt0}</div><p class="c big" id="rs"></p>`);
 $('#go').onclick=()=>{const b=take();if(!b)return;$('#go').hidden=true;$('#rs').textContent='';
  const d=deck(),mk=()=>({t:d.splice(0,4),s:d.splice(0,14)}),me=mk(),bot=mk(),mid=[d.pop(),d.pop()];let over=0;
  const pile=c=>mid.findIndex(p=>[1,12].includes(Math.abs(c.r-p.r))),left=p=>p.t.filter(Boolean).length+p.s.length,moves=p=>p.t.some(c=>c&&pile(c)>=0);
  const play=(p,i)=>{const c=p.t[i],k=c?pile(c):-1;if(k<0)return 0;mid[k]=c;p.t[i]=p.s.pop()||null;return 1};
  const end=w=>{over=1;if(w)add(b*2);$('#rs').textContent=w?'You win '+usd(b):'Bot wins';$('#go').hidden=false;$('#go').textContent='Deal again'};
  const chk=()=>{if(!left(me))end(1);else if(!left(bot))end(0)};
  const flip=()=>[me,bot].forEach((p,k)=>{let c=p.s.pop();if(!c){const j=p.t.findIndex(Boolean);if(j>=0){c=p.t[j];p.t[j]=null}}if(c)mid[k]=c});
  const render=()=>{$('#tb').innerHTML=`<div class="felt"><p class="mu c">Bot: ${left(bot)} cards left</p><div class="hand bt">${bot.t.map(c=>c?cd(c):'<span class="pc e"></span>').join('')}</div><div class="hand">${mid.map(c=>cd(c)).join('')}</div><div class="hand">${me.t.map((c,i)=>c?`<button class="cbt" data-i="${i}">${cd(c)}</button>`:'<span class="pc e"></span>').join('')}</div><p class="mu c">You: ${left(me)} cards left</p></div>`;
   $$('.cbt').forEach(x=>x.onpointerdown=()=>{if(!over&&play(me,+x.dataset.i)){chk();render()}})};
  render();
  I(()=>{if(over)return;if(!moves(me)&&!moves(bot))flip();else if(Math.random()<.75){const i=bot.t.findIndex(c=>c&&pile(c)>=0);if(i>=0)play(bot,i)}chk();render()},1000)}}
function rCasino(){$('#t-casino').innerHTML='<div class="felt"><p class="mu">The House Table</p><div class="hand">'+cd({r:1,s:'♠'})+cd({r:13,s:'♥'})+cd({r:10,s:'♦'})+'</div><span class="chip">$5</span><span class="chip c2">$25</span><span class="chip c3">$100</span></div><p class="mu">Bet any amount you have. You play against the house bot.</p>'+[['Blackjack','Beat the dealer bot to 21. Blackjack pays 3 to 2.'],['Spit','A real-time card race against a bot. Win pays double.'],['Color Wheel','Bet on the color the wheel lands on. Rarer colors pay more.']].map(([n,d],i)=>`<div class="box gm"><div><b>${n}</b><p class="mu">${d}</p></div><button class="pri sm" data-c="${i}">Play</button></div>`).join('')}

// ---------- Jobs ----------
const JOBS=[['Inventory Tracker','boxes','Count stock arriving at the warehouse'],['Mail Room Clerk','letters','Log incoming mail and sort it'],['Records Assistant','files','Keep the records office organized'],['Shipping Coordinator','parcels','Track outgoing parcels']];
function rJobs(){$('#t-jobs').innerHTML='<p class="mu">Apply for a job, then finish tasks. Every 15 tasks pays $5. A wrong answer sets you back 2 tasks.</p>'+JOBS.map(([n,,d],i)=>{const j=S.jobs[i];return `<div class="box gm"><div><b>${n}</b><p class="mu">${d}</p>${j?`<small class="mu">${j.n} tasks done, ${j.n%15}/15 to next paycheck</small>`:''}</div><button class="${j?'':'pri'} sm" data-j="${i}">${j?'Work':'Apply'}</button></div>`}).join('')}
function apply(i){if(S.jobs[i])return work(i,'c');S.jobs[i]={n:0};save();
 openOv('Application','<p class="c mu">Reviewing your application...</p>');
 O(()=>{openOv('You’re hired',`<div class="c"><div class="big">Welcome aboard</div><p class="mu">${JOBS[i][0]}. Choose your kind of work.</p><div class="two"><button class="pri" id="wc">Computer work</button><button class="pri" id="wp">Paperwork</button></div></div>`);$('#wc').onclick=()=>work(i,'c');$('#wp').onclick=()=>work(i,'p')},1300)}
function work(i,k){const j=S.jobs[i],J=JOBS[i];let t;
 if(k=='c'){const q=1+rn(40);t={h:`Order #${1000+rn(9000)} arrived with ${q} ${J[1]}.`,q}}
 else t=[['Payment due within 30 days. Total $'+(20+rn(300)),'Invoice'],['Thank you for your purchase. Paid $'+(5+rn(80)),'Receipt'],['Team meeting moved to '+(1+rn(11))+' PM on Friday','Memo']][rn(3)];
 const fk=[1,2,3].map(()=>`<tr><td>${J[1]}</td><td>${1+rn(30)}</td></tr>`).join('');
 const scr=k=='c'?`<div class="mon"><div class="scr"><div class="wt"><i></i><i></i><i></i>&nbsp;${J[0]} · Tracker</div><div class="mail">📧 New message: ${t.h}</div><table class="sheet"><tr><th>Item</th><th>Qty</th></tr>${fk}<tr class="hl"><td>${J[1]} (new)</td><td><input id="an" type="number" inputmode="numeric" placeholder="?"></td></tr></table><button class="pri" id="sb" style="margin-top:8px">Log entry</button></div></div><div class="stand"></div>`:`<div class="desk"><div class="ppr">${t[0]}</div><p class="c" style="color:#fff;margin:14px 0 0;font-weight:600">File it in the right folder</p><div class="fold">${['Invoice','Receipt','Memo'].map(f=>`<button data-f="${f}">📁<br>${f}</button>`).join('')}</div></div>`;
 openOv(J[0],`<div class="seg"><button data-k="c" class="${k=='c'?'on':''}">Computer work</button><button data-k="p" class="${k=='p'?'on':''}">Paperwork</button></div><div class="box"><div class="bar"><i style="width:${j.n%15/15*100}%"></i></div><small class="mu">${j.n%15}/15 tasks to next $5</small>${scr}</div>`);
 const done=ok=>{if(!ok){j.n=Math.max(j.n-j.n%15,j.n-2);save();toast('Wrong! Lost 2 tasks of progress');return work(i,k)}j.n++;if(j.n%15==0){add(5);toast('Paycheck: +$5.00')}else save();work(i,k)};
 $$('.seg button').forEach(b=>b.onclick=()=>work(i,b.dataset.k));
 if(k=='c'){$('#sb').onclick=()=>done(+$('#an').value==t.q);$('#an').onkeydown=e=>e.key=='Enter'&&$('#sb').click();$('#an').focus()}
 else $$('[data-f]').forEach(b=>b.onclick=()=>done(b.dataset.f==t[1]))}

// ---------- App shell ----------
const R={card:rCard,pay:rPay,games:rGames,trade:rTrade,casino:rCasino,jobs:rJobs};let T='card';
function go(t){T=t;$$('.tab').forEach(e=>e.classList.toggle('on',e.id=='t-'+t));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));scrollTo(0,0);R[t]()}
document.addEventListener('click',e=>{const c=s=>e.target.closest(s);let x;
 if(c('#gear'))return rSet();if(x=c('[data-th]')){S.theme=x.dataset.th;save();applyTheme();return rSet()}if(x=c('nav button'))return go(x.dataset.t);
 if(x=c('[data-g]'))return[clicker,whack,memory][x.dataset.g]();
 if(x=c('[data-c]'))return[bj,spit,wheel][x.dataset.c]();
 if(x=c('[data-j]'))return apply(+x.dataset.j);
 if(x=c('.sw'))return buySw(x)});
upd();go('card');claim();
</script>
